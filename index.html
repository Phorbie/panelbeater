<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panelbeater</title>
<meta name="description" content="Reshape 3D-printable bodies with typed numbers: stretch, taper, mirror and pin STL and 3MF files in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working screen. Stage (3D view on a cutting mat) left, the op stack right; stacks vertically on phones. */
:root {
  --paper: #e9ecee;        /* primer-grey workshop light */
  --panel: #f6f7f8;
  --ink: #1b2126;
  --muted: #5a646c;
  --line: #d2d8dc;
  --accent: #2741c4;       /* machinist's layout blue */
  --accent-ink: #ffffff;
  --accent-soft: #dfe4fb;
  --tape: #d4ad3f;         /* masking tape: pinned zones */
  --tape-soft: #f4e7bd;
  --stage: #dfe3e6;
  --mat: #2e5a4c;          /* self-healing cutting mat */
  --mat-line: #4f7d6d;
  --mat-major: #8fb3a2;
  --primer: #a7adb2;       /* body render colour */
  --ax-x: #c9443a; --ax-y: #3a9459; --ax-z: #3866d1;
  --good: #2c7a4b; --warn: #a76400; --bad: #bb3328;
  --heat-mid: #e2b21c; --heat-hi: #cf3a2a;

  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141719; --panel: #1b1f22; --ink: #e2e6e9; --muted: #96a0a8; --line: #2d3338;
    --accent: #8394ff; --accent-ink: #0d1020; --accent-soft: #232a4d;
    --tape: #e0bd55; --tape-soft: #3b3320;
    --stage: #101315; --mat: #1d3a31; --mat-line: #2f5649; --mat-major: #5d8a79;
    --primer: #8e959b;
    --ax-x: #ec6a5f; --ax-y: #5cc27f; --ax-z: #6f97f2;
    --good: #57b77e; --warn: #e09a3a; --bad: #ef6a5d;
    --heat-mid: #e8bf38; --heat-hi: #f0574a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141719; --panel: #1b1f22; --ink: #e2e6e9; --muted: #96a0a8; --line: #2d3338;
  --accent: #8394ff; --accent-ink: #0d1020; --accent-soft: #232a4d;
  --tape: #e0bd55; --tape-soft: #3b3320;
  --stage: #101315; --mat: #1d3a31; --mat-line: #2f5649; --mat-major: #5d8a79;
  --primer: #8e959b;
  --ax-x: #ec6a5f; --ax-y: #5cc27f; --ax-z: #6f97f2;
  --good: #57b77e; --warn: #e09a3a; --bad: #ef6a5d;
  --heat-mid: #e8bf38; --heat-hi: #f0574a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 14px/1.45 var(--f-ui);
  display: grid; grid-template-rows: auto minmax(0, 1fr);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, input[type="number"] { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- top bar ---------- */
.top {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.wordmark {
  font: 800 26px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0;
}
.wordmark span { color: var(--accent); }
.filechip { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); cursor: pointer;
  font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 16px; height: 16px; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.vh:focus-visible + .btn { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- workspace ---------- */
.work { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 400px); min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage.picking canvas { cursor: crosshair; }

.hud { position: absolute; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.hud.tl { top: 12px; left: 12px; }
.hud.tr { top: 12px; right: 12px; justify-content: flex-end; }
.hud.bl { bottom: 12px; left: 108px; right: 12px; align-items: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(6px); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pill.static { cursor: default; }
.pillgroup { display: inline-flex; }
.pillgroup .pill { border-radius: 0; }
.pillgroup .pill:first-child { border-radius: 999px 0 0 999px; }
.pillgroup .pill:last-child { border-radius: 0 999px 999px 0; border-left: 0; }

.readout { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; padding: 6px 10px; border-radius: var(--r);
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.readout b { font-weight: 500; }
.readout .delta { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); } .chip.wait { color: var(--muted); }

.legend { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
.legend i { display: block; width: 110px; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--primer), var(--heat-mid) 35%, var(--heat-hi)); }

.banner {
  position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 3;
  background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: var(--r);
  font-weight: 500; box-shadow: 0 4px 18px rgb(0 0 0 / .18); max-width: calc(100% - 32px); text-align: center;
}
.drop {
  position: absolute; inset: 12px; z-index: 4; border: 2px dashed var(--accent); border-radius: 12px;
  display: grid; place-items: center; background: color-mix(in srgb, var(--accent-soft) 85%, transparent);
  font: 800 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--accent);
}
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; color: var(--muted); }
.nogl {
  position: absolute; z-index: 4; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(460px, calc(100% - 32px)); padding: 16px 18px; border-radius: var(--r);
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgb(0 0 0 / .18);
  display: grid; gap: 8px; font-size: 13px;
}
.nogl strong { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.nogl p { margin: 0; color: var(--muted); }
.nogl code { font: 12px var(--f-num); color: var(--ink); }

/* ---------- op panel ---------- */
.panel { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); }
.panel-inner {
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
.sec-title { font: 700 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.addbar { display: grid; gap: 8px; }
.addrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.addrow .lbl { font-size: 12px; color: var(--muted); width: 48px; }
.add { height: 30px; padding: 0 10px; border-radius: var(--r); border: 1px dashed var(--muted); background: transparent; cursor: pointer; font-size: 13px; }
.add:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }

.hint { font-size: 13px; color: var(--muted); }
.notice { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--paper); }
.notice .btn { justify-self: start; height: 30px; }

.ops { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.op { border-bottom: 1px solid var(--line); }
.op.sel { background: var(--paper); }
.op.off .op-head { opacity: .5; }
.op-head { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 4px 9px 2px; cursor: pointer; }
.op-n { font: 500 12px/1 var(--f-num); color: var(--muted); text-align: right; }
.op-title { min-width: 0; }
.op-name { font: 700 16px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.op-name .tag { font: 600 10px/1 var(--f-ui); letter-spacing: .06em; padding: 2px 5px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; background: var(--tape-soft); color: var(--ink); }
.op-sum { font: 12px/1.3 var(--f-num); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-tools { display: flex; gap: 2px; }
.icon { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 4px; cursor: pointer; color: var(--muted); }
.icon:hover { background: var(--line); color: var(--ink); }
.icon svg { width: 15px; height: 15px; }
.icon:disabled { opacity: .3; cursor: default; background: transparent; }
.op-note { font-size: 12px; color: var(--muted); padding: 0 8px 8px 32px; }
.op-note:empty { display: none; }
.op-note.err { color: var(--bad); }
.op-body { display: grid; gap: 10px; padding: 2px 8px 14px 32px; }

.field { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; }
.flabel { font-size: 13px; color: var(--muted); }
.fhint { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -4px; }
.numwrap { display: flex; align-items: center; gap: 4px; min-width: 0; }
.numwrap input { width: 100%; min-width: 0; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.numwrap input:focus { border-color: var(--accent); }
.unit { font: 12px var(--f-num); color: var(--muted); }
.pick { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; color: var(--muted); }
.pick:hover, .pick[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.pick svg { width: 15px; height: 15px; }
.pick-spacer { width: 30px; flex: none; }
.vec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 4px; align-items: center; }
.vec input { height: 32px; width: 100%; min-width: 0; padding: 0 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.vec .ax-x-line { border-bottom: 2px solid var(--ax-x); }
.vec .ax-y-line { border-bottom: 2px solid var(--ax-y); }
.vec .ax-z-line { border-bottom: 2px solid var(--ax-z); }
.steps-title { margin-bottom: 8px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; justify-self: start; }
.seg button { height: 30px; padding: 0 11px; border: 0; background: var(--panel); cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg .axbtn { font: 600 13px var(--f-num); min-width: 38px; }
.ax-x { color: var(--ax-x); } .ax-y { color: var(--ax-y); } .ax-z { color: var(--ax-z); }
.seg button[aria-pressed="true"].ax-x { background: var(--ax-x); color: #fff; }
.seg button[aria-pressed="true"].ax-y { background: var(--ax-y); color: #fff; }
.seg button[aria-pressed="true"].ax-z { background: var(--ax-z); color: #fff; }

.region { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.region summary { padding: 8px 10px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.region summary .num { color: var(--muted); font-size: 12px; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.region .rbody { display: grid; gap: 8px; padding: 2px 10px 10px; }
.rrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto minmax(0, 1fr) auto; gap: 4px; align-items: center; }
.rrow input { height: 30px; width: 100%; min-width: 0; padding: 0 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.rrow .to { font-size: 12px; color: var(--muted); padding: 0 2px; }
.rrow .ax { font: 600 12px var(--f-num); }

.foot { font-size: 12px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.foot a { color: inherit; }
kbd { font: 11px var(--f-num); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10;
  background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: var(--r); font-size: 13px;
  box-shadow: 0 6px 24px rgb(0 0 0 / .25); max-width: calc(100% - 32px);
}

@media (max-width: 820px) {
  body { height: auto; min-height: 100%; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
  .panel { overflow: visible; border-left: 0; border-top: 1px solid var(--line); }
  .hud.bl { left: 100px; }
  .readout { font-size: 12px; gap: 2px 10px; }
  .filechip { max-width: 100%; }
}
@media (max-width: 460px) {
  .field { grid-template-columns: 1fr; gap: 4px; }
  .fhint { grid-column: 1; margin-top: 0; }
  .hud.tr .pill.view { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 class="wordmark">Panel<span>beater</span></h1>
    <span class="filechip" id="filechip">No model loaded</span>
  </div>
  <div class="actions">
    <!-- Native label → input: opens the picker in every browser and sandboxed view, no script click needed.
         No accept filter: Safari and iOS grey out .3mf files they don't recognise; the loader validates instead. -->
    <input type="file" id="file-model" class="vh">
    <label class="btn" for="file-model" id="btn-open" title="Open an STL or 3MF file">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>Open model
    </label>
    <input type="file" id="file-recipe" class="vh">
    <label class="btn" for="file-recipe" id="btn-recipe-load" title="Load a saved recipe (.json)">Load recipe</label>
    <button class="btn" id="btn-recipe-save" type="button" title="Save the operation stack as a recipe (.json)">Save recipe</button>
    <button class="btn primary" id="btn-export" type="button" title="Export the full result as a binary STL">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13.5h10"/></svg>Export STL
    </button>
  </div>
</header>

<main class="work">
  <section class="stage" id="stage" aria-label="3D view">
    <div class="hud tl">
      <div class="pillgroup" role="group" aria-label="Shading">
        <button class="pill" id="v-shaded" type="button" aria-pressed="true">Shaded</button>
        <button class="pill" id="v-strain" type="button" aria-pressed="false" title="Colour faces by how much they were stretched">Strain</button>
      </div>
      <button class="pill" id="v-ghost" type="button" aria-pressed="false" title="Overlay the outline of the model before any shaping">Before</button>
    </div>
    <div class="hud tr">
      <button class="pill view" type="button" data-view="iso">3/4</button>
      <button class="pill view" type="button" data-view="top">Top</button>
      <button class="pill view" type="button" data-view="front" title="Looking from −Y">Front</button>
      <button class="pill view" type="button" data-view="side" title="Looking from +X">Side</button>
    </div>
    <div class="hud bl">
      <div class="readout" id="readout" aria-live="polite"></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="drop" id="drop" hidden>Drop STL or 3MF</div>
    <div class="loading" id="loading">Loading…</div>
  </section>

  <aside class="panel" aria-label="Operations">
    <div class="panel-inner" id="panel"></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
